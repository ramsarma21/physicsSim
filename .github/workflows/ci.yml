# CI for the physics sandbox:
#   checks    (Linux, Node 24 = Vercel's runtime, and Node 26) syntax of every JS/TS/Python file; vercel.json's function patterns; the
#             generated files (vendor, scenario list, web/sim's sprites.js and unicode.js); the engine bundle; every node:test file; the
#             engine's real-world validators (research/rw-validate*.ts); the static site build
#   machines  (Linux) the Python scene builder's tests (every machines/test_*.py), which run the engine from tooling/src/sim
#   macos     (macOS arm64) the engine bundle, every node:test file (Node 24 and 26), the static site build, the Vercel deploy check
#             (`npm run check:vercel`: vercel build on the exact upload, then the built functions are called), web/sim's trig.js against
#             macOS libm, and the Python <-> JS parity suite (tools/parity/run.sh) against web/server.py started in the job
#   parity-linux  (Linux x64) the same parity suite on glibc's libm and V8 built without fused multiply-adds: the builders' sin/cos at
#             multiples of 30 degrees and their powers are platform-free (machines/crmath.py), so it is expected to pass here too, except
#             where another libm function lands exactly on a rounding tie (the hanging chain's documented case, tools/parity/mechanisms.mjs
#             --groups chainties, not in the suite); non-blocking until it has passed on main (see the job)
# The engine bundle (web/sim/engine-worker.js, engine-math.js) is committed, and every job that needs it rebuilds it with
# `npm run build:engine` from the clean checkout (its pow is tools/crpow.ts, correctly rounded, written for this project: nothing outside
# the repository is needed) and fails if the result differs from the committed bundle, or if the bundle is not committed
# (.github/scripts/engine-bundle.sh), as a Vercel deploy would. The validators run the engine with the bundle's math
# (tools/engine-math-node.mjs), as the server's worker does.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # the fix-search tests' time budgets were measured on an 18-core Mac; a CI runner gets 4x the time for the same runs (web/ai/fixer.js TIME_SCALE)
      AI_FIX_TIME_SCALE: "4"
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: npm ci
        run: npm ci
      - name: Link the paths the research scripts assume
        id: paths
        run: |
          .github/scripts/ci-paths.sh
          mkdir -p ci-logs
      - name: Syntax (node --check, strip-only TypeScript, py_compile)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: |
          node --no-warnings .github/scripts/syntax-check.mjs
          git ls-files -z '*.py' | xargs -0 python -m py_compile
          echo "py_compile: $(git ls-files '*.py' | wc -l | tr -d ' ') Python files compile"
      - name: vercel.json function patterns match files of this commit
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: node .github/scripts/vercel-functions.mjs
      - name: Engine bundle (npm run build:engine; must equal the committed one)
        id: engine
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: .github/scripts/engine-bundle.sh
      - name: Generated files are up to date (vendor, scenario list, web/sim/sprites.js and unicode.js)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: |
          npm run vendor:three:check
          npm run vendor:media:check
          npm run vendor:clerk:check
          npm run gen:scenarios:check
          python tools/parity/gen_sprites.py >/dev/null
          python tools/parity/gen_unicode.py >/dev/null
          # unicode.js's first line names the CPython patch release that wrote it (the dev machine's 3.13.x): only that line may differ
          git diff --exit-code -I '^// Generated by tools/parity/gen_unicode\.py from CPython [0-9.]+' -- web/sim/sprites.js web/sim/unicode.js
          git checkout -- web/sim/unicode.js
          echo "web/sim/sprites.js and unicode.js regenerate byte for byte (tools/parity/gen_sprites.py, gen_unicode.py with CPython $(python -c 'import platform; print(platform.python_version())'))"
      - name: zsh (web/server.py starts each AI step as zsh -c '... node ai/cli.mjs'; ai/test/server.test.mjs runs that real command)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: command -v zsh || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zsh)
      - name: Unit tests (node --test)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        run: .github/scripts/unit-tests.sh ${{ steps.engine.outputs.built == 'true' }}
      - name: Engine validators (research/rw-validate*.ts; rw-validate.ts is a smoke run)
        if: ${{ !cancelled() && steps.paths.outcome == 'success' }}
        # a smaller crash fuzz on the 4-core Linux runner (the macOS job and local runs keep p4's default 5000 scenes)
        env:
          FUZZ_N: "1500"
          FUZZ_JOBS: "4"
        run: .github/scripts/validators.sh
      - name: Static site (npm run build:static:nogen)
        if: ${{ !cancelled() && steps.engine.outputs.built == 'true' }}
        run: npm run build:static:nogen
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: checks-node${{ matrix.node }}-logs
          path: |
            ci-logs/
            dist/
            research/tmp/
          if-no-files-found: ignore
          retention-days: 14

  machines:
    name: Scene builder tests (Linux, machines/test_*.py)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: npm ci, pip install (.github/requirements-ci.txt)
        run: |
          npm ci
          python -m pip install -r .github/requirements-ci.txt
      - name: Link the paths the research scripts assume
        run: |
          .github/scripts/ci-paths.sh
          mkdir -p ci-logs
      - name: machines/test_*.py (every one, even after a failure)
        run: |
          rc=0
          n=0
          for t in machines/test_*.py; do
            n=$((n + 1))
            name="$(basename "$t" .py)"
            echo "::group::$t"
            start=$(date +%s)
            if python "$t" 2>&1 | tee "ci-logs/$name.log"; then
              echo "::endgroup::"
              echo "ok      $t ($(($(date +%s) - start)) s): $(tail -n 1 "ci-logs/$name.log" | cut -c1-140)"
            else
              echo "::endgroup::"
              echo "::error title=Scene builder test failed::$t (ci-logs/$name.log)"
              rc=1
            fi
          done
          echo "machines: $n test files"
          exit $rc
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: machines-logs
          path: |
            ci-logs/
            research/tmp/
            scenes/.test-*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  macos:
    name: Engine bundle, unit tests, deploy check, parity (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      # the fix-search tests' time budgets were measured on an 18-core Mac; a CI runner gets 4x the time for the same runs (web/ai/fixer.js TIME_SCALE)
      AI_FIX_TIME_SCALE: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Platform
        run: |
          sw_vers
          uname -m
          python3 -c 'import sys, platform; print(sys.version); print(platform.mac_ver())'
          node --version
      - name: npm ci
        run: npm ci
      - name: Link the paths the research scripts assume
        run: |
          .github/scripts/ci-paths.sh
          mkdir -p ci-logs
      - name: Engine bundle (npm run build:engine; must equal the committed one)
        id: engine
        run: .github/scripts/engine-bundle.sh
      - name: web/sim/trig.js is up to date (CPython on macOS libm)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: |
          python3 tools/parity/gen_trig.py >/dev/null
          git diff --exit-code -- web/sim/trig.js
          echo "web/sim/trig.js regenerates byte for byte (tools/parity/gen_trig.py)"
      - name: Unit tests, every node:test file (Node 24, Vercel's runtime)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: .github/scripts/unit-tests.sh true
      - name: Static site (npm run build:static:nogen)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: npm run build:static:nogen
      - name: Vercel deploy check (npm run check:vercel; nothing is deployed)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: |
          # the CLI version Vercel's own builds ran (their build log: "Vercel CLI 64.0.2"); vercel build needs no login here
          npm install -g --no-audit --no-fund vercel@64.0.2
          npm run check:vercel
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        with:
          # Node 26, as on the development machine: under Node 24.20 fuzz-live.mjs's fetch() of web/server.py's answers dies in
          # undici's own parser (AssertionError: assert(!this.paused), in Parser.finish), before comparing anything
          node-version: 26
      - name: Unit tests, every node:test file (Node 26)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: .github/scripts/unit-tests.sh true
      - name: Parity suite (tools/parity/run.sh, with web/server.py on :8790)
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        run: .github/scripts/parity-macos.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  parity-linux:
    name: Python <-> JS parity (Linux x64, glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # glibc's libm and V8 on x64 are not the development machine's: machines/crmath.py and web/sim read the same table for sin/cos at
    # multiples of 30 degrees and compute the same correctly rounded powers, so this is expected to pass. The builders' other libm calls
    # (tan, atan2, acos, asin, sinh/cosh/asinh, log10, sin/cos at other angles) are still glibc's in Python and V8's in web/sim: a last-bit
    # difference shows only where a printed number lands exactly on a rounding tie (the hanging chain's documented case,
    # tools/parity/mechanisms.mjs --groups chainties, is not in the suite), and no run here has proven the rest yet. It does not block a
    # merge until it has passed on main once; then delete this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 26, as in the macOS job's parity step (fuzz-live.mjs's fetch() dies in undici's parser under Node 24.20)
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Platform
        run: |
          uname -a
          ldd --version | head -n 1
          python3 -c 'import sys; print(sys.version)'
          node --version
      - name: npm ci
        run: npm ci
      - name: Link the paths the research scripts assume
        run: |
          .github/scripts/ci-paths.sh
          mkdir -p ci-logs
      - name: Engine bundle (npm run build:engine; must equal the committed one)
        id: engine
        run: .github/scripts/engine-bundle.sh
      - name: Parity suite (tools/parity/run.sh, with web/server.py on :8790)
        if: ${{ steps.engine.outputs.built == 'true' }}
        run: PARITY_JOBS=4 .github/scripts/parity-macos.sh
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-linux-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
