<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Models: everyday silhouettes</title>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd; font: 12px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #info { position: fixed; left: 8px; top: 8px; background: #000a; padding: 4px 8px; border-radius: 6px; z-index: 2; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info"></div>
<script type="module">
// VISUAL REVIEW page for the everyday-b (everyday silhouettes) models. Layout as models-everyday-b.html (extent of the doc solids),
// plus outline overlays drawn through the camera projection over a snapshot.
//   ?items=water-bottle,coffee-mug,glass-jar@lid     catalog keys (key@tag = a second copy with props from ?props={"glass-jar@lid":{"lid":true}})
//   window.shoot(name, {i, x, y, z, dist, az, el, fov})  orbit camera at item i (or a point), save web/dev/shots/<name>.png
//   window.outline(name, i, {az, el, fov, pad})  near-orthographic frontal shot with the physics outlines drawn on (z=0 green, front magenta, back cyan)
window.__logs = []
for (const k of ["warn", "error"]) { const o = console[k].bind(console); console[k] = (...a) => { window.__logs.push(k + ": " + a.map((x) => (x && x.stack) || String(x)).join(" ")); o(...a) } }
window.addEventListener("error", (e) => window.__logs.push("error: " + e.message))
const { createView3D } = await import("../view3d.js")

const q = new URLSearchParams(location.search)
const keys = (q.get("items") || "water-bottle,coffee-mug").split(",")
const info = document.getElementById("info")
const say = (m) => (info.textContent = m)
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body) })
  if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`)
  return r.json()
}
const catalog = await (await fetch("/api/catalog?reload=1")).json()
const byKey = new Map(catalog.types.map((t) => [t.key, t]))
const STAGE = { x0: -2, x1: 2, y0: -0.15, y1: 1 }
const mkScene = (items) => ({ version: 2, id: "review", name: "review", seconds: Number(q.get("seconds") || 1), release: 0.1, stage: STAGE, items, goals: [] })

const worldOf = (doc) => {
  const by = new Map(doc.solids.map((s) => [s.id, s]))
  const memo = new Map()
  const pose = (s) => {
    if (memo.has(s.id)) return memo.get(s.id)
    const l = { x: s.at.x, y: s.at.y, a: s.angle ?? 0 }
    let w = l
    if (s.parent && by.has(s.parent)) {
      const p = pose(by.get(s.parent))
      const c = Math.cos(p.a), n = Math.sin(p.a)
      w = { x: p.x + l.x * c - l.y * n, y: p.y + l.x * n + l.y * c, a: p.a + l.a }
    }
    memo.set(s.id, w)
    return w
  }
  return pose
}
const outlineOf = (s) => {
  const b = s.body
  if (b.kind === "polygon") return b.points.map((p) => [p.x, p.y])
  if (b.kind === "slab") {
    const hw = b.width / 2, hh = b.height / 2, t = b.taper
    return t != null ? [[-hw * t, -hh], [hw * t, -hh], [hw, hh], [-hw, hh]] : [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]]
  }
  return Array.from({ length: 96 }, (_, i) => [b.radius * Math.cos((i / 96) * 2 * Math.PI), b.radius * Math.sin((i / 96) * 2 * Math.PI)])
}
const extent = (doc) => {
  const W = worldOf(doc)
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9
  for (const s of doc.solids) {
    const p = W(s)
    for (const [px, py] of outlineOf(s)) {
      const X = p.x + px * Math.cos(p.a) - py * Math.sin(p.a), Y = p.y + px * Math.sin(p.a) + py * Math.cos(p.a)
      x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y)
    }
  }
  return { x0, x1, y0, y1 }
}

const extra = JSON.parse(q.get("props") || "{}")
const items = [{ id: "table", type: "table", name: "Table", x: 0, y: 0, angle: 0, props: { width: 6, thickness: 0.15 } }]
const layout = []
let cursor = 0
const GAP = Number(q.get("gap") || 0.06)
const fixed = q.get("fixed") !== "0"
for (const entry of keys) {
  const k = entry.split("@")[0]
  const id = entry.replace("@", "-")
  const t = byKey.get(k)
  if (!t) { say("unknown type " + k); continue }
  const props = extra[entry] ?? extra[k] ?? {}
  const lay = await post("/api/layout", { scene: mkScene([{ id: "a", type: k, x: 0, y: 0, angle: 0, props }]) })
  const e = extent(lay.doc)
  const w = e.x1 - e.x0, h = e.y1 - e.y0
  const x = cursor - e.x0
  const lift = Number(q.get("lift") ?? 0.0015)
  const y = -e.y0 + lift
  cursor += w + GAP
  items.push({ id, type: k, name: t.name, x, y, angle: 0, fixed, props })
  layout.push({ id, type: k, x: x + (e.x0 + e.x1) / 2, y: y + (e.y0 + e.y1) / 2, w, h, depth: Math.max(...lay.doc.solids.map((s) => s.body.depth ?? s.length ?? 2 * (s.body.radius ?? 0))) })
}
const shift = cursor / 2
for (const it of items) if (it.id !== "table") it.x -= shift
for (const l of layout) l.x -= shift
items[0].props.width = Math.max(1.2, cursor + 0.8)
const scene = mkScene(items)
const sim = await post("/api/simulate", { scene })
window.sim = sim
window.layout = layout
window.catalog = catalog
window.scene = scene

const view = createView3D(document.getElementById("stage"))
window.view = view
view.setOptions({ looks: catalog.looks })
view.load(sim, null)
view.setOptions({ camera: "orbit" })
view.render(0)
const d = view._debug
d.controls.minDistance = 0.004
d.controls.maxPolarAngle = Math.PI * 0.499
d.controls.enableDamping = false
let T = 0
window.setT = (t) => { T = t; view.render(t) }

window.aim = (opts = {}) => {
  const L = opts.i !== undefined ? layout[opts.i] ?? layout.find((l) => l.id === opts.i) : null
  const x = opts.x ?? (L ? L.x : 0)
  const y = opts.y ?? (L ? L.y : 0.05)
  const z = opts.z ?? 0
  const dist = opts.dist ?? (L ? 2.6 * Math.max(L.w, L.h) : 0.4)
  const az = opts.az ?? 0.5
  const el = opts.el ?? 0.45
  d.orbitCam.fov = opts.fov ?? 28
  d.orbitCam.near = opts.near ?? Math.max(0.002, dist / 60)
  d.orbitCam.far = opts.far ?? 40
  d.orbitCam.updateProjectionMatrix()
  d.controls.minAzimuthAngle = -Infinity
  d.controls.maxAzimuthAngle = Infinity
  d.controls.target.set(x, y, z)
  d.orbitCam.position.set(x + dist * Math.sin(az) * Math.cos(el), y + dist * Math.sin(el), z + dist * Math.cos(az) * Math.cos(el))
  d.controls.update()
  view.render(T)
}
const save = async (name, canvas) => (await fetch("/api/dev/snapshot", { method: "POST", body: JSON.stringify({ name, png: canvas.toDataURL() }) })).status
window.shoot = async (name, opts = {}) => {
  window.aim(opts)
  view.render(T)
  return save(name, d.renderer.domElement)
}
const projPx = (x, y, z = 0) => {
  const c = d.renderer.domElement
  const v = new d.THREE.Vector3(x, y, z).project(d.orbitCam)
  return [(v.x * 0.5 + 0.5) * c.width, (-v.y * 0.5 + 0.5) * c.height]
}
// placements at time T (world), falling back to the doc's own poses
const W0 = worldOf(sim.doc)
const poseAt = (s) => {
  const fr = sim.track.frames
  const k = Math.min(fr.length - 1, Math.max(0, Math.round(T * (sim.track.fps || 120))))
  const p = fr[k]?.placements?.[s.id] ?? fr[0]?.placements?.[s.id]
  if (p) return { x: p.x, y: p.y, a: p.angle ?? 0 }
  return W0(s)
}
window.overlay = async (name, { ids = null, depthBox = true } = {}) => {
  view.render(T)
  const src = d.renderer.domElement
  const c = document.createElement("canvas")
  c.width = src.width
  c.height = src.height
  const g = c.getContext("2d")
  const img = new Image()
  img.src = src.toDataURL()
  await img.decode()
  g.drawImage(img, 0, 0)
  g.lineWidth = 2
  for (const s of sim.doc.solids) {
    if (s.item === "table") continue
    if (ids && !ids.includes(s.item)) continue
    const p = poseAt(s)
    const hd = (s.body.depth ?? s.length ?? 2 * (s.body.radius ?? 0)) / 2
    const layers = depthBox ? [[hd, "rgba(255,0,200,0.9)"], [-hd, "rgba(0,180,255,0.9)"], [0, "#00ff66"]] : [[0, "#00ff66"]]
    for (const [z, col] of layers) {
      g.strokeStyle = col
      g.beginPath()
      outlineOf(s).forEach(([lx, ly], k) => {
        const X = p.x + lx * Math.cos(p.a) - ly * Math.sin(p.a), Y = p.y + lx * Math.sin(p.a) + ly * Math.cos(p.a)
        const [px, py] = projPx(X, Y, z)
        k ? g.lineTo(px, py) : g.moveTo(px, py)
      })
      g.closePath()
      g.stroke()
    }
  }
  return save(name, c)
}
window.outline = async (name, i, opts = {}) => {
  const L = layout.find((l) => l.id === i) ?? layout[i]
  const span = Math.max(L.w, L.h)
  const fov = opts.fov ?? 3
  const dist = opts.dist ?? (span * (opts.pad ?? 1.25)) / (2 * Math.tan((fov * Math.PI) / 360))
  window.aim({ x: L.x, y: opts.y ?? L.y, dist, az: opts.az ?? 0, el: opts.el ?? 0.0001, fov, near: dist * 0.5, far: dist * 2 })
  return window.overlay(name, { ids: [i], depthBox: opts.depthBox ?? true })
}
// model bounding box vs outline extents (mm; + sticks out, - falls short)
window.fit = () => {
  const B = d.THREE
  const rows = []
  for (const l of layout) {
    const sols = sim.doc.solids.filter((s) => s.item === l.id)
    const box = new B.Box3()
    for (const s of sols) {
      let h = null
      d.scene.traverse((o) => { if (o.name === s.id) h = o })
      if (h) { h.updateWorldMatrix(true, true); box.union(new B.Box3().setFromObject(h)) }
    }
    const mm = (v) => +(v * 1000).toFixed(1)
    rows.push({ id: l.id, x: [mm(l.x - l.w / 2 - box.min.x), mm(box.max.x - l.x - l.w / 2)], y: [mm(l.y - l.h / 2 - box.min.y), mm(box.max.y - l.y - l.h / 2)], z: [mm(-l.depth / 2 - box.min.z), mm(box.max.z - l.depth / 2)] })
  }
  return rows
}
window.ready = true
say(`${layout.length} items`)
window.addEventListener("error", (e) => say("ERROR " + e.message))
</script>
</body>
</html>
