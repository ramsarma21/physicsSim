const { createView3D } = await import("../view3d.js")
const info = document.getElementById("info")
const say = (m) => (info.textContent = m)
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body) })
  if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`)
  return r.json()
}
const catalog = await (await fetch("/api/catalog")).json()
window.catalog = catalog
const worldOf = (S, s) => {
  if (!s.parent) return { at: s.at, angle: s.angle ?? 0 }
  const p = worldOf(S, S.get(s.parent))
  const c = Math.cos(p.angle), n = Math.sin(p.angle)
  return { at: { x: p.at.x + s.at.x * c - s.at.y * n, y: p.at.y + s.at.x * n + s.at.y * c }, angle: p.angle + (s.angle ?? 0) }
}
const ptsOf = (b) => {
  if (b.kind === "polygon") return b.points.map((p) => [p.x, p.y])
  const hw = b.width / 2, hh = b.height / 2, tp = b.taper ?? 1
  return [[-hw, -hh], [hw, -hh], [hw * tp, hh], [-hw * tp, hh]]
}
const ext = (doc, only = null) => {
  const S = new Map(doc.solids.map((s) => [s.id, s]))
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity
  for (const s of doc.solids) {
    if (only && s.item !== only) continue
    const w = worldOf(S, s)
    const b = s.body
    if (b.kind === "ball") { x0 = Math.min(x0, w.at.x - b.radius); x1 = Math.max(x1, w.at.x + b.radius); y0 = Math.min(y0, w.at.y - b.radius); y1 = Math.max(y1, w.at.y + b.radius); continue }

}

window.look = (x, y, dist = 0.4, az = 0, el = 0.15, tt = T0) => {
  if (x === "c") { x = window.E.cx; y = window.E.cy }
  view.setOptions({ camera: "orbit" })
  view.render(tt)
  const d = view._debug
  d.orbitCam.near = Math.max(0.002, dist / 80)

  d.controls.minDistance = 0.004
  d.controls.minAzimuthAngle = -Infinity

const placeAt = (tt) => {
  const fr = sim.track.frames
  const base = fr[0].placements

  for (const f of fr) if (f.t <= tt + 1e-9) best = f

}
window.placeAt = placeAt
window.outline = async (name, cx = window.E.cx, cy = window.E.cy, viewW = Math.max(window.E.w, window.E.h * 1.6) * 1.3, tt = T0) => {

  const vw = viewW, vh = viewW / aspect

  oc.lookAt(cx, cy, 0)
  oc.updateMatrixWorld()
  d.renderer.render(d.scene, oc)
  const c2 = document.createElement("canvas")
  c2.width = cv.width
  c2.height = cv.height
  const g = c2.getContext("2d")
  g.drawImage(cv, 0, 0)

  const sy = (Y) => (1 - (Y - (cy - vh / 2)) / vh) * cv.height

  g.strokeStyle = "rgba(255,0,255,0.95)"

    if (s.item !== "it") continue

    const b = s.body
    const ca = Math.cos(p.angle ?? 0), sa = Math.sin(p.angle ?? 0)

}
/** The same outline drawn through view.toScreen over the wide (perspective) frontal picture: the machine plane z = 0. */

    const ca = Math.cos(p.angle ?? 0), sa = Math.sin(p.angle ?? 0)

window.bbox = () => {
  const { THREE } = view._debug
  const rows = []
  for (const s of sim.doc.solids) {
    if (s.item !== "it") continue
    const holder = view._debug.run.group.getObjectByName(s.id)
    if (!holder) { rows.push(`${s.id}: (no model)`); continue }
    holder.updateMatrixWorld(true)
    const inv = new THREE.Matrix4().copy(holder.matrixWorld).invert()
    const b = new THREE.Box3()
    holder.traverse((o) => {
      if (!o.isMesh || !o.geometry || !o.visible) return
      const pa = o.geometry.attributes.position
      const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld)
      const v = new THREE.Vector3()
      for (let i = 0; i < pa.count; i++) b.expandByPoint(v.fromBufferAttribute(pa, i).applyMatrix4(m))
    })
    if (b.isEmpty()) { rows.push(`${s.id}: (empty)`); continue }

    let o
    if (body.kind === "ball") o = { x0: -body.radius, x1: body.radius, y0: -body.radius, y1: body.radius, hd: (s.depth3d ?? 2 * body.radius) / 2 }
    else if (body.kind === "polygon") o = { x0: Math.min(...body.points.map((p) => p.x)), x1: Math.max(...body.points.map((p) => p.x)), y0: Math.min(...body.points.map((p) => p.y)), y1: Math.max(...body.points.map((p) => p.y)), hd: body.depth / 2 }
    else o = { x0: -body.width / 2, x1: body.width / 2, y0: -body.height / 2, y1: body.height / 2, hd: body.depth / 2 }
    const f = (v) => (v * 1000).toFixed(2)
    rows.push(`${s.id}: x ${f(o.x0 - b.min.x)}/${f(b.max.x - o.x1)}  y ${f(o.y0 - b.min.y)}/${f(b.max.y - o.y1)}  z ${f(-o.hd - b.min.z)}/${f(b.max.z - o.hd)}`)

}
/** Triangles the run draws for the item (all its holders), instancing counted. */
window.tris = () => {
  let n = 0, meshes = 0
  for (const s of sim.doc.solids) {
    if (s.item !== "it") continue
    const h = view._debug.run.group.getObjectByName(s.id)
    if (!h) continue
    h.traverse((o) => {
      if (!o.isMesh || !o.visible) return
      meshes++
      const g = o.geometry
      const c = g.index ? g.index.count / 3 : g.attributes.position.count / 3
      n += c * (o.isInstancedMesh ? o.count : 1)

  }
  return { tris: Math.round(n), meshes }
}
say("ready")
window.ready = true
window.addEventListener("error", (e) => say("ERROR " + e.message))

for (let i = 0; i < 100 && !window.ready; i++) await new Promise((r) => setTimeout(r, 100))
const view = window.view
window.bbox2 = (item = "it") => {
  const { THREE } = view._debug
  const rows = []
  for (const s of sim.doc.solids) {
    if (s.item !== item) continue
    const h = view._debug.run.group.getObjectByName(s.id)
    if (!h) { rows.push(s.id + ": no model"); continue }
    h.updateMatrixWorld(true)
    const inv = new THREE.Matrix4().copy(h.matrixWorld).invert()
    const b = new THREE.Box3(), v = new THREE.Vector3(), im = new THREE.Matrix4()
    h.traverse((o) => {
      if (!o.isMesh || !o.visible || !o.geometry) return
      const pa = o.geometry.attributes.position
      const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld)
      const n = o.isInstancedMesh ? o.count : 1

    else o = { x0: -body.width / 2, x1: body.width / 2, y0: -body.height / 2, y1: body.height / 2, hd: body.depth / 2 }

}

    const ca = Math.cos(p.angle ?? 0), sa = Math.sin(p.angle ?? 0)
    const pts = b.kind === "polygon" ? b.points.map((q) => [q.x, q.y]) : (() => { const hw = b.width / 2, hh = b.height / 2, tp = b.taper ?? 1; return [[-hw, -hh], [hw, -hh], [hw * tp, hh], [-hw * tp, hh]] })()
    return pts.map(([lx, ly]) => [p.x + lx * ca - ly * sa, p.y + lx * sa + ly * ca])
  }
  window.physPolys = (item = "it") => { const P = placeAt(0); return sim.doc.solids.filter((s) => s.item === item && s.body.kind !== "ball").map((s) => worldPts(s, P)) }
  /** the physics' top surface at x (max y over the item's convex solids), or null */
  window.physTop = (x, item = "it") => {
    let best = null
    for (const poly of physPolys(item)) {
      const ys = []
      for (let i = 0; i < poly.length; i++) {
        const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length]
        if ((x0 - x) * (x1 - x) <= 0 && x0 !== x1) ys.push(y0 + ((x - x0) / (x1 - x0)) * (y1 - y0))
      }
      if (ys.length) { const m = Math.max(...ys); if (best === null || m > best) best = m }
    }
    return best
  }
  /** drawn-floor error (mm; + = drawn above the physics) at nx points across x in [xa, xb] */
  window.floorErr = (xa, xb, nx = 9, z = 0) => Array.from({ length: nx }, (_, i) => { const x = xa + ((xb - xa) * i) / (nx - 1); const h = vertHits(x, z)[0]; const p = physTop(x); return [+x.toFixed(3), h === undefined || p === null ? null : +((h - p) * 1000).toFixed(1)] })
  /** outermost drawn x of a horizontal ray from each side at height y vs the physics' outermost x there (mm; + = drawn sticks out) */
  window.sideErr = (ys, z = 0) => ys.map((y) => {
    const polys = physPolys(), xs = []
    for (const poly of polys) for (let i = 0; i < poly.length; i++) {
      const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length]
      if ((y0 - y) * (y1 - y) <= 0 && y0 !== y1) xs.push(x0 + ((y - y0) / (y1 - y0)) * (x1 - x0))
    }
    if (!xs.length) return [y, null]
    const pl = Math.min(...xs), pr = Math.max(...xs)
    const hl = horHits(y, z, 1)[0], hr = horHits(y, z, -1)[0]
    return [+y.toFixed(3), hl === undefined ? null : +((pl - hl) * 1000).toFixed(1), hr === undefined ? null : +((hr - pr) * 1000).toFixed(1)]
  })
}
/** A basket with a golf ball and a tennis ball resting on its floor (fixed): the wide view, a view into it from above, the rim close up, a low view at the wall's foot, and the ortho outline. */
window.doBasket = async (name, props = {}, o = {}) => {
  const t = props.thickness ?? 0.01
  const r1 = 0.02135, r2 = 0.0335
  const W = props.width ?? 0.45, Wb = W * (props.bottom_ratio ?? 1)
  const more = o.noBalls ? [] : [
    { id: "golf", type: "golf-ball", x: 1.3 - Math.min(0.05, Wb / 4), y: t + r1, angle: 0, props: {}, fixed: true },
    { id: "tennis", type: "tennis-ball", x: 1.3 + Math.min(0.05, Wb / 4), y: t + r2, angle: 0, props: {}, fixed: true },
  ]
  const r = await show("basket", { props, more, ctx: false, ...(o.show ?? {}) })
  cam("wide"); view.render(0)
  const full = grab()
  const crop = cropAround(full, E.x0, E.y0, E.x1, E.y1)
  const ol = await outlineC()
  const M = Math.max(E.w, E.h)
  look(E.cx, E.y0 + E.h * 0.3, M * 1.6, o.az1 ?? 0.35, o.el1 ?? 0.9); const cA = grab()
  look(E.x1 - 0.02, E.y1, o.d2 ?? 0.16, o.az2 ?? 0.7, o.el2 ?? 0.35); const cB = grab()
  look(E.cx - Wb / 2 + 0.01, t + 0.01, o.d3 ?? 0.25, o.az3 ?? 0.2, o.el3 ?? 0.12); const cC = grab()
  look(E.cx, E.y0 + E.h * 0.4, M * 1.4, Math.PI * 0.46, 0.5); const cD = grab()
  cam("wide")
  const st = await sheet(name, [crop, ol, cA, cB, cC, cD], ["wide crop", "outline", "into it (above)", "rim close", "foot (low)", "end view"], 960, 600)
  return { st, E, bbox: bbox2(), tris: tris() }
}
/** Ray checks of a basket against its physics at the given props: floor (vertical rays between the walls' feet), outer face (horizontal rays), the top edge (vertical rays over the wall tops). mm; + = drawn sticks out / above. */
window.basketCheck = async (props = {}) => {
  await show("basket", { props, ctx: false })
  const W = props.width ?? 0.45, H = props.wall ?? 0.18, t = props.thickness ?? 0.01, r = props.bottom_ratio ?? 1
  const base = E.y0 + t // the floor's top
  const ys = Array.from({ length: 13 }, (_, i) => base + 0.004 + ((H - 0.008) * i) / 12)
  const side = sideErr(ys, 0)
  const sideMax = Math.max(...side.flatMap((q) => q.slice(1).filter((v) => v !== null).map(Math.abs)))
  const sideMin = Math.min(...side.flatMap((q) => q.slice(1).filter((v) => v !== null)))
  const sideMaxS = Math.max(...side.flatMap((q) => q.slice(1).filter((v) => v !== null)))
  const wallX = (y) => { const xs = []; for (const poly of physPolys().slice(1)) for (let i = 0; i < poly.length; i++) { const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length]; if ((y0 - y) * (y1 - y) <= 0 && y0 !== y1) xs.push(x0 + ((y - y0) / (y1 - y0)) * (x1 - x0)) } return xs }
  // the top: x across the right wall's top edge
  const poly = physPolys()[2] ?? physPolys()[1]
  const topXs = poly.map((q) => q[0]), xa = Math.min(...topXs), xb = Math.max(...topXs)
  const top = Array.from({ length: 11 }, (_, i) => { const x = xa + 0.002 + ((xb - xa - 0.004) * i) / 10; const h = vertHits(x, 0)[0]; const pt = physTop(x); return h === undefined ? null : +(((h - pt) * 1000).toFixed(1)) })
  const feet = Math.min(0.06, r * W / 2 * 0.9)
  const fl = floorErr(E.cx - feet, E.cx + feet, 9).map(([, e]) => e)
  const f = (a) => a.filter((v) => v !== null)
  return { props, floorMin: Math.min(...f(fl)), floorMax: Math.max(...f(fl)), sideIn: sideMin, sideOut: sideMaxS, top: top.join(" "), tris: tris().tris }
}
/** One panel per prop set (an oblique view of the whole item, an elevated view into it for a container): window.sizes(name, key, [props...], {labels}) -> sheet. */
window.sizes = async (name, key, list, o = {}) => {
  const panels = [], labels = []
  for (const props of list) {
    await show(key, { props, ctx: false, ...(o.show ?? {}) })
    const M = Math.max(E.w, E.h)
    look("c", undefined, M * (o.k ?? 1.7) + 0.05, o.az ?? -0.5, o.el ?? 0.5)
    panels.push(grab())
    labels.push(Object.entries(props).map(([k, v]) => k + " " + v).join("  "))
  }
  cam("wide")
  return sheet(name, panels, labels, 900, 620)
}
view.resize()
window.r3ready = true
</script>
