<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfaces review</title>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd; font: 12px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #info { position: fixed; left: 8px; top: 8px; background: #000a; padding: 4px 8px; border-radius: 6px; z-index: 2; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info">loading</div>
<script type="module">
// Visual review page (reviewer's own) for web/models/surfaces.js, rods.js, containers.js; approach of test-3d.html.
//   ?item=<key>  one catalog item resting on a table (its lowest part on the top)   ?props={...}  ?angle=  ?lift=<m>
//   ?more=[items] extra scene items (e.g. a ball)   ?t=<s>   ?sec=<s>
//   window.look(x, y, dist, az, el, tt)   orbit close-up (x, y world; or look("c") = the item's middle)
//   window.snap(name, tt)                 save canvas to web/dev/shots/<name>.png
//   window.outline(name, cx, cy, viewW, tt)  orthographic front view, every doc solid's physics outline in magenta
//   window.bbox()                         exact model extents vs each physics body (mm; + sticks out, - short)
window.__warn = []
for (const k of ["warn", "error"]) { const o = console[k].bind(console); console[k] = (...a) => { window.__warn.push(k + ": " + a.map(String).join(" ")); o(...a) } }
await Promise.all(["../models/surfaces.js", "../models/surfaces-lib.js", "../models/rods.js", "../models/containers.js", "../models3d.js", "../view3d.js"].map((u) => fetch(new URL(u, location.href), { cache: "reload" })))
const { createView3D } = await import("../view3d.js")
const q = new URLSearchParams(location.search)
const info = document.getElementById("info")
const say = (m) => (info.textContent = m)
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body) })
  if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`)
  return r.json()
}
const catalog = await (await fetch("/api/catalog?reload=1")).json()
const key = q.get("item") || "plank"
const props = JSON.parse(q.get("props") || "{}")
const angle = Number(q.get("angle") || 0)
// world outline of every solid (parents resolved) for a doc
const worldOf = (S, s) => {
  if (!s.parent) return { at: s.at, angle: s.angle ?? 0 }
  const p = worldOf(S, S.get(s.parent))
  const c = Math.cos(p.angle), n = Math.sin(p.angle)
  return { at: { x: p.at.x + s.at.x * c - s.at.y * n, y: p.at.y + s.at.x * n + s.at.y * c }, angle: p.angle + (s.angle ?? 0) }
}
const ptsOf = (b) => {
  if (b.kind === "polygon") return b.points.map((p) => [p.x, p.y])
  const hw = b.width / 2, hh = b.height / 2, tp = b.taper ?? 1
  return [[-hw, -hh], [hw, -hh], [hw * tp, hh], [-hw * tp, hh]]
}
const ext = (doc) => {
  const S = new Map(doc.solids.map((s) => [s.id, s]))
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity
  for (const s of doc.solids) {
    const w = worldOf(S, s)
    const b = s.body
    if (b.kind === "ball") { x0 = Math.min(x0, w.at.x - b.radius); x1 = Math.max(x1, w.at.x + b.radius); y0 = Math.min(y0, w.at.y - b.radius); y1 = Math.max(y1, w.at.y + b.radius); continue }
    const c = Math.cos(w.angle), n = Math.sin(w.angle)
    for (const [lx, ly] of ptsOf(b)) { const X = w.at.x + lx * c - ly * n, Y = w.at.y + lx * n + ly * c; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y) }
  }
  return { x0, x1, y0, y1 }
}
const one = { version: 2, id: "x", name: "x", seconds: 0.1, release: 0.1, stage: { x0: -1, x1: 1, y0: -1, y1: 1 }, items: [{ id: "it", type: key, x: 0, y: 0, angle, props }], goals: [] }
const e0 = ext((await post("/api/layout", { scene: one })).doc)
const X0 = Number(q.get("x") || 0.6)
const ix = X0 - (e0.x0 + e0.x1) / 2
const iy = -e0.y0 + Number(q.get("lift") || 0)
const items = [{ id: "table", type: "table", name: "Table", x: 0.6, y: 0, angle: 0, props: { width: 2.6, thickness: 0.15 } }]
items.push({ id: "it", type: key, name: key, x: ix, y: iy, angle, props, fixed: q.get("fixed") !== "0" })
for (const e of JSON.parse(q.get("more") || "[]")) items.push({ angle: 0, props: {}, ...e })
const scene = { version: 2, id: "review-surf", name: "surf review", seconds: Number(q.get("sec") || 1), release: Number(q.get("rel") || 0.5), stage: { x0: -0.7, x1: 1.9, y0: -0.156, y1: 1.6 }, items, goals: [] }
const sim = await post("/api/simulate", { scene })
window.sim = sim
window.scene = scene
window.E = { x0: e0.x0 + ix, x1: e0.x1 + ix, y0: e0.y0 + iy, y1: e0.y1 + iy, cx: X0, cy: iy + (e0.y0 + e0.y1) / 2, w: e0.x1 - e0.x0, h: e0.y1 - e0.y0 }
const view = createView3D(document.getElementById("stage"))
window.view = view
view.setOptions({ looks: catalog.looks })
view.load(sim, null)
const T0 = Number(q.get("t") || 0)
if (q.get("cam")) view.setOptions({ camera: q.get("cam") })
view.render(T0)

window.look = (x, y, dist = 0.4, az = 0, el = 0.15, tt = T0) => {
  if (x === "c") { x = window.E.cx; y = window.E.cy }
  view.setOptions({ camera: "orbit" })
  view.render(tt)
  const d = view._debug
  d.orbitCam.near = Math.max(0.002, dist / 80)
  d.orbitCam.updateProjectionMatrix()
  d.controls.minDistance = 0.004
  d.controls.minAzimuthAngle = -Infinity
  d.controls.maxAzimuthAngle = Infinity
  d.controls.maxPolarAngle = Math.PI * 0.499
  d.controls.target.set(x, y, 0)
  d.orbitCam.position.set(x + dist * Math.sin(az) * Math.cos(el), y + dist * Math.sin(el), dist * Math.cos(az) * Math.cos(el))
  d.controls.update()
  view.render(tt)
}
window.cam = (mode, tt = T0) => { view.setOptions({ camera: mode }); view.render(tt) }
window.snap = async (name, tt = T0) => {
  view.render(tt)
  const r = await fetch("/api/dev/snapshot", { method: "POST", body: JSON.stringify({ name, png: view._debug.renderer.domElement.toDataURL() }) })
  return r.status
}
const placeAt = (tt) => {
  const fr = sim.track.frames
  const base = fr[0].placements
  let best = fr[0]
  for (const f of fr) if (f.t <= tt + 1e-9) best = f
  return { ...base, ...best.placements }
}
window.placeAt = placeAt
/** Orthographic front view centred at (cx, cy) spanning viewW metres across; doc solids' outlines in magenta. */
window.outline = async (name, cx = window.E.cx, cy = window.E.cy, viewW = Math.max(window.E.w, window.E.h * 1.6) * 1.3, tt = T0) => {
  const d = view._debug, THREE = d.THREE
  view.render(tt)
  const cv = d.renderer.domElement
  const aspect = cv.width / cv.height
  const vw = viewW, vh = viewW / aspect
  const oc = new THREE.OrthographicCamera(-vw / 2, vw / 2, vh / 2, -vh / 2, 0.05, 40)
  oc.position.set(cx, cy, 10)
  oc.lookAt(cx, cy, 0)
  oc.updateMatrixWorld()
  d.renderer.render(d.scene, oc)
  const c2 = document.createElement("canvas")
  c2.width = cv.width
  c2.height = cv.height
  const g = c2.getContext("2d")
  g.drawImage(cv, 0, 0)
  const sx = (X) => ((X - (cx - vw / 2)) / vw) * cv.width
  const sy = (Y) => (1 - (Y - (cy - vh / 2)) / vh) * cv.height
  const P = placeAt(tt)
  g.strokeStyle = "rgba(255,0,255,0.95)"
  g.lineWidth = Math.max(1, cv.width / 1440)
  for (const s of sim.doc.solids) {
    if (s.item === "table") continue
    const p = P[s.id] ?? { x: s.at.x, y: s.at.y, angle: s.angle ?? 0 }
    const b = s.body
    const ca = Math.cos(p.angle ?? 0), sa = Math.sin(p.angle ?? 0)
    const W = (lx, ly) => [p.x + lx * ca - ly * sa, p.y + lx * sa + ly * ca]
    g.beginPath()
    if (b.kind === "ball") g.arc(sx(p.x), sy(p.y), (b.radius / vw) * cv.width, 0, Math.PI * 2)
    else ptsOf(b).forEach(([lx, ly], i) => { const [X, Y] = W(lx, ly); i ? g.lineTo(sx(X), sy(Y)) : g.moveTo(sx(X), sy(Y)) })
    g.closePath()
    g.stroke()
  }
  const r = await fetch("/api/dev/snapshot", { method: "POST", body: JSON.stringify({ name, png: c2.toDataURL() }) })
  view.render(tt)
  return r.status
}
/** Exact bounding box of each model against its physics body, in the body's frame (mm; + = sticks out of the outline, - = falls short). */
window.bbox = () => {
  const { THREE } = view._debug
  const rows = []
  for (const s of sim.doc.solids) {
    if (s.item === "table") continue
    const holder = view._debug.run.group.getObjectByName(s.id)
    if (!holder) { rows.push(`${s.id}: (no model)`); continue }
    holder.updateMatrixWorld(true)
    const inv = new THREE.Matrix4().copy(holder.matrixWorld).invert()
    const b = new THREE.Box3()
    holder.traverse((o) => {
      if (!o.isMesh || !o.geometry || !o.visible) return
      const pa = o.geometry.attributes.position
      const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld)
      const v = new THREE.Vector3()
      for (let i = 0; i < pa.count; i++) b.expandByPoint(v.fromBufferAttribute(pa, i).applyMatrix4(m))
    })
    if (b.isEmpty()) { rows.push(`${s.id}: (empty)`); continue }
    const body = s.body
    let o
    if (body.kind === "ball") o = { x0: -body.radius, x1: body.radius, y0: -body.radius, y1: body.radius, hd: (s.depth3d ?? 2 * body.radius) / 2 }
    else if (body.kind === "polygon") o = { x0: Math.min(...body.points.map((p) => p.x)), x1: Math.max(...body.points.map((p) => p.x)), y0: Math.min(...body.points.map((p) => p.y)), y1: Math.max(...body.points.map((p) => p.y)), hd: body.depth / 2 }
    else o = { x0: -body.width / 2, x1: body.width / 2, y0: -body.height / 2, y1: body.height / 2, hd: body.depth / 2 }
    const f = (v) => (v * 1000).toFixed(2)
    rows.push(`${s.id}: x ${f(o.x0 - b.min.x)}/${f(b.max.x - o.x1)}  y ${f(o.y0 - b.min.y)}/${f(b.max.y - o.y1)}  z ${f(-o.hd - b.min.z)}/${f(b.max.z - o.hd)}`)
  }
  return rows
}
/** The item as a whole (angle 0 only): union of every model's world box against the union of its parts' outlines and depths (mm; + sticks out). */
window.bboxItem = () => {
  const { THREE } = view._debug
  const S = new Map(sim.doc.solids.map((s) => [s.id, s]))
  const B = new THREE.Box3()
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, hz = 0
  for (const s of sim.doc.solids) {
    if (s.item === "table") continue
    const h = view._debug.run.group.getObjectByName(s.id)
    if (h) { h.updateMatrixWorld(true); h.traverse((o) => { if (o.isMesh && o.visible) { o.geometry.computeBoundingBox(); B.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)) } }) }
    const w = worldOf(S, s), b = s.body
    hz = Math.max(hz, (b.kind === "ball" ? (s.depth3d ?? 2 * b.radius) : b.depth) / 2)
    if (b.kind === "ball") { x0 = Math.min(x0, w.at.x - b.radius); x1 = Math.max(x1, w.at.x + b.radius); y0 = Math.min(y0, w.at.y - b.radius); y1 = Math.max(y1, w.at.y + b.radius); continue }
    const c = Math.cos(w.angle), n = Math.sin(w.angle)
    for (const [lx, ly] of ptsOf(b)) { const X = w.at.x + lx * c - ly * n, Y = w.at.y + lx * n + ly * c; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y) }
  }
  const f = (v) => (v * 1000).toFixed(2)
  return `item: x ${f(x0 - B.min.x)}/${f(B.max.x - x1)}  y ${f(y0 - B.min.y)}/${f(B.max.y - y1)}  z ${f(-hz - B.min.z)}/${f(B.max.z - hz)}`
}
say("ready " + key)
window.ready = true
window.addEventListener("error", (e) => say("ERROR " + e.message))
</script>
</body>
</html>
