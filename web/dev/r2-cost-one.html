<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R2 cold build</title>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Reviewer's page: the cold build of one or more items' models in a fresh page (nothing baked or cached yet).
//   ?items=a,b,c  built one after another in this page (the first is cold; the later ones reuse what the earlier baked)  ?props={...} for a single item
// posts {item, ms, tris, meshes, parts, bakes} rows to the parent (or sets window.result)
const q = new URLSearchParams(location.search)
const keys = (q.get("items") || "plank").split(",")
const props = JSON.parse(q.get("props") || "{}")
const { buildModel } = await import("../models3d.js")
const catalog = await (await fetch("/api/catalog")).json()
const out = []
for (const key of keys) {
  const one = { version: 2, id: "x", name: "x", seconds: 0.1, release: 0.1, stage: { x0: -1, x1: 1, y0: -1, y1: 1 }, items: [{ id: "it", type: key, x: 0, y: 0, angle: 0, props: keys.length === 1 ? props : {} }], goals: [] }
  const lay = await (await fetch("/api/layout", { method: "POST", body: JSON.stringify({ scene: one }) })).json()
  const res = lay.resolved?.it ?? {}
  const before = { ...(globalThis.__bakeMs ?? {}) }
  let tris = 0, meshes = 0, ms = 0
  const parts = {}
  for (const s of lay.doc.solids) {
    const t0 = performance.now()
    const o = buildModel(s, { props: res, look: catalog.looks[s.look] ?? {} })
    const dt = performance.now() - t0
    ms += dt
    let pt = 0
    if (o) o.traverse((m) => {
      if (!m.isMesh) return
      meshes++
      const g = m.geometry
      const c = g.index ? g.index.count / 3 : g.attributes.position.count / 3
      pt += c * (m.isInstancedMesh ? m.count : 1)
    })
    tris += pt
    parts[s.part] = [Math.round(dt), Math.round(pt)]
  }
  const bakes = {}
  for (const [k, v] of Object.entries(globalThis.__bakeMs ?? {})) if (!(k in before)) bakes[k] = v
  out.push({ item: key, ms: Math.round(ms), tris: Math.round(tris), meshes, solids: lay.doc.solids.length, parts, bakes })
}
window.result = out
parent.postMessage({ r2cost: out }, "*")
</script>
</body>
</html>
