<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block models test</title>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #222; color: #ddd; font: 12px system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #info { position: fixed; left: 8px; top: 8px; background: #000a; padding: 4px 8px; border-radius: 6px; z-index: 2; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info">loading</div>
<script type="module">
// Dev page for web/models/blocks.js: every block item on a table, close-up cameras, snapshots.
//   window.look(x, y, dist, az, el)  orbit camera at world point (x, y) from dist m, az (rad around y), el (rad up)
//   window.snap(name)               saves the canvas to web/dev/shots/<name>.png
//   window.POS[type]                x of each item;   window.shoot(type, [[az, el, dist], ...])  snapshots one item in several views
const q = new URLSearchParams(location.search)
window.__warn = []
for (const k of ["warn", "error"]) { const o = console[k].bind(console); console[k] = (...a) => { window.__warn.push(k + ": " + a.map(String).join(" ")); o(...a) } }
// make sure the browser re-reads the model files we edit (module imports follow the HTTP cache)
await Promise.all(["../models/blocks.js", "../models3d.js", "../view3d.js"].map((u) => fetch(new URL(u, location.href), { cache: "reload" })))
const { createView3D } = await import("../view3d.js")
const info = document.getElementById("info")
const say = (m) => (info.textContent = m)
const post = async (url, body) => {
  const r = await fetch(url, { method: "POST", body: JSON.stringify(body) })
  if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`)
  return r.json()
}
const catalog = await (await fetch("/api/catalog?reload=1")).json()


const VARIANTS = [
 { id: "wb-cork", type: "wooden-block", x: 6.2, y: 0.025, props: { material: "cork" } },
 { id: "wb-dark", type: "wooden-block", x: 6.45, y: 0.025, props: { material: "dark wood" } },
 { id: "wb-brick", type: "wooden-block", x: 6.7, y: 0.025, props: { material: "brick" } },
 { id: "wb-foam", type: "wooden-block", x: 6.95, y: 0.025, props: { material: "foam" } },
 { id: "wb-ice", type: "wooden-block", x: 7.2, y: 0.025, props: { material: "ice" } },
 { id: "brick-conc", type: "brick", x: 7.5, y: 0.0325, props: { material: "concrete" } },
 { id: "ice-glass", type: "ice-cube", x: 7.85, y: 0.02, props: { material: "glass" } },
 { id: "box-wood", type: "cardboard-box", x: 8.2, y: 0.1, props: { material: "varnished hardwood" } },
 { id: "foam-cork", type: "foam-block", x: 8.7, y: 0.05, props: { material: "cork" } },
 { id: "log-cork", type: "wooden-log", x: 9.1, y: 0.06, props: { material: "cork" } },
 { id: "log-dark", type: "wooden-log", x: 9.4, y: 0.06, props: { material: "dark wood" } },
 { id: "wall-big", type: "wall", x: 9.8, y: 0.0, props: { height: 2.4, thickness: 0.08 } },
 { id: "wb-long", type: "wooden-block", x: 10.5, y: 0.05, props: { width: 0.4, height: 0.1, depth: 0.12 } },
 { id: "brick-big", type: "brick", x: 11.3, y: 0.05, props: { width: 0.5, height: 0.1, depth: 0.2 } },
 { id: "steel-12", type: "steel-weight-1kg", x: 11.9, y: 0.06, props: { mass: 12.3 } },
 { id: "steel-035", type: "steel-weight-1kg", x: 12.2, y: 0.02, props: { mass: 0.35 } },
 { id: "dom-tall", type: "domino", x: 12.45, y: 0.0, props: { height: 0.15, thickness: 0.02, depth: 0.07 } },
 { id: "log-big", type: "wooden-log", x: 12.9, y: 0.15, props: { diameter: 0.3, length: 0.5 } },
]
window.VARIANTS = VARIANTS
const TW = Number(q.get("tw") || (q.get("variants") ? 15 : 7))
const T = { width: TW, thickness: 0.15 }
const POS = { "wooden-block": 0, brick: 0.45, "steel-weight-1kg": 0.85, "steel-weight-5kg": 1.15, "foam-block": 1.6, "ice-cube": 2.05, "cardboard-box": 2.5, "wooden-log": 3.05, domino: 3.5, "domino-row": 3.85, wall: 5.4 }
const items = [{ id: "table", type: "table", name: "Table", x: 2.5 + (TW - 7) / 2, y: 0, angle: 0, props: T }]
const ctr = { "wooden-block": 0.025, brick: 0.0325, "steel-weight-1kg": 0.025, "steel-weight-5kg": 0.04275, "foam-block": 0.05, "ice-cube": 0.02, "cardboard-box": 0.1, "wooden-log": 0.06, domino: 0, "domino-row": 0, wall: 0 }
const extra = JSON.parse(q.get("props") || "{}")
for (const [type, x] of Object.entries(POS)) items.push({ id: type, type, name: type, x, y: ctr[type], angle: 0, props: extra[type] ?? {}, fixed: true })
for (const e of q.get("variants") ? VARIANTS : JSON.parse(q.get("more") || "[]")) items.push({ ...e, angle: e.angle ?? 0, props: e.props ?? {}, fixed: true })
const scene = { version: 2, id: "models-blocks", name: "blocks", seconds: 1, release: 0.5, stage: { x0: -0.5, x1: 6, y0: -0.156, y1: 2.0 }, items, goals: [] }
const sim = await post("/api/simulate", { scene })
window.sim = sim
const view = createView3D(document.getElementById("stage"))
window.view = view
view.setOptions({ looks: catalog.looks })
const tl = performance.now()
view.load(sim, null)
window.loadMs = performance.now() - tl
view.setOptions({ camera: "orbit" })
window.POS = POS

window.look = (x, y, dist = 0.4, az = 0, el = 0.15, tt = 0) => {
  view.setOptions({ camera: "orbit" })
  view.render(tt)
  const d = view._debug
  d.controls.target.set(x, y, 0)
  d.orbitCam.position.set(x + dist * Math.sin(az) * Math.cos(el), y + dist * Math.sin(el), dist * Math.cos(az) * Math.cos(el))
  d.controls.update()
  view.render(tt)
}
window.snap = async (name, tt = 0) => {
  view.render(tt)
  const r = await fetch("/api/dev/snapshot", { method: "POST", body: JSON.stringify({ name, png: view._debug.renderer.domElement.toDataURL() }) })
  return r.status
}
window.shoot = async (type, views, dy = null) => {
  const x = POS[type]
  const y = dy ?? ctr[type] ?? 0.05
  const out = []
  for (let i = 0; i < views.length; i++) {
    const [az, el, dist] = views[i]
    window.look(x, y, dist, az, el)
    out.push(await window.snap(`blocks-${type}-${i}`))
  }
  return out
}
window.setCam = (px, py, pz, tx, ty, tz) => {
  const d = view._debug
  d.controls.target.set(tx, ty, tz)
  d.orbitCam.position.set(px, py, pz)
  d.controls.update()
  view.render(0)
}
// how well each model fills its physics box: bounding box of the drawn model against the body (mm; + = sticks out, - = falls short)
window.bbox = () => {
  const { THREE } = view._debug
  const rows = []
  for (const s of sim.doc.solids) {
    if (!s.itemType || s.itemType === "table") continue
    const holder = view._debug.run.group.getObjectByName(s.id)
    if (!holder) { rows.push(`${s.id}: (no model)`); continue }
    holder.updateMatrixWorld(true)
    const b = new THREE.Box3().setFromObject(holder)
    const c = holder.position
    const body = s.body
    const ball = body.kind === "ball"
    const hw = ball ? body.radius : body.width / 2, hh = ball ? body.radius : body.height / 2
    const hd = ball ? (s.length ?? 4 * body.radius) / 2 : body.depth / 2
    const f = (v) => (v * 1000).toFixed(2)
    rows.push(`${s.id}: x ${f(b.min.x - c.x + hw)}/${f(b.max.x - c.x - hw)}  y ${f(b.min.y - c.y + hh)}/${f(b.max.y - c.y - hh)}  z ${f(b.min.z + hd)}/${f(b.max.z - hd)}`)
  }
  return rows
}
say("ready")
window.ready = true
window.addEventListener("error", (e) => say("ERROR " + e.message))
</script>
</body>
</html>
