<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>R3 catalog cards (card-fix helpers)</title>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root { --view-bg: #f4f4f2; --card: #ffffff; }
:root[data-theme="dark"] { --view-bg: #232220; --card: #24221f; color-scheme: dark; }
body { margin: 0; background: var(--card); font: 12px system-ui; color: #888; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px }
.cell { background: var(--view-bg); border-radius: 6px; position: relative }
.cell canvas { display: block }
</style>
</head>
<body><div class="grid" id="grid"></div>
<script type="module">
// Round-3 contact sheet of every catalog card, as the app paints them (96 x 72 css px canvases at dpr 2 unless ?w= says otherwise).
//   ?theme=light|dark  ?items=a,b,c (default all)  ?w=96 (css width)  ?cols=12
//   window.sheet(name) -> saves web/dev/shots/<name>.png (a labelled sheet); window.cells = [[key, canvas]]
const q = new URLSearchParams(location.search)
const theme = q.get("theme") || "light"
if (theme === "dark") document.documentElement.dataset.theme = "dark"
const thumbs = await import("../thumbs3d.js")
const catalog = await (await fetch("/api/catalog?reload=1")).json()
thumbs.setCatalog(catalog)
const only = q.get("items") ? q.get("items").split(",") : null
const cw = +(q.get("w") || 96)
const ch = Math.round(cw * 0.75)
const dpr = +(q.get("dpr") || 2)
const grid = document.getElementById("grid")
const cells = []
const t0 = performance.now()
for (const t of catalog.types) {
  if (only && !only.includes(t.key)) continue
  const cell = document.createElement("div")
  cell.className = "cell"
  const cv = document.createElement("canvas")
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr)
  cv.style.width = cw + "px"; cv.style.height = ch + "px"
  cell.append(cv); grid.append(cell)
  cells.push([t.key, cv])
  cells[cells.length - 1].push(t.preview)
  if (q.get("seq")) { const a = performance.now(); thumbs.drawPreview3D(cv, t.preview, catalog.looks, null); while (!thumbs.hasShot(t.preview)) await new Promise((r) => setTimeout(r, 5)); (window.perItem ??= {})[t.key] = Math.round(performance.now() - a) }
  else thumbs.drawPreview3D(cv, t.preview, catalog.looks, null)
}
window.cells = cells
window.thumbs = thumbs
window.pending = () => cells.filter(([, , p]) => !thumbs.hasShot(p)).map(([k]) => k)
for (let i = 0; i < 1200 && window.pending().length; i++) await new Promise((r) => setTimeout(r, 250))
window.renderMs = performance.now() - t0
window.sheet = async (name, { cols = +(q.get("cols") || 12), label = true } = {}) => {
  const pad = 6
  const w = cells[0][1].width, h = cells[0][1].height
  const out = document.createElement("canvas")
  out.width = cols * (w + pad) + pad
  out.height = Math.ceil(cells.length / cols) * (h + pad) + pad
  const g = out.getContext("2d")
  const css = getComputedStyle(document.documentElement)
  const page = theme === "dark" ? "#24221f" : "#ffffff"
  const bg = theme === "dark" ? "#232220" : "#f4f4f2"
  g.fillStyle = page; g.fillRect(0, 0, out.width, out.height)
  cells.forEach(([k, cv], i) => {
    const x = pad + (i % cols) * (w + pad), y = pad + Math.floor(i / cols) * (h + pad)
    g.fillStyle = bg; g.fillRect(x, y, w, h) // the card's own background behind the picture, as the app has
    g.drawImage(cv, x, y)
    if (label) { g.fillStyle = theme === "dark" ? "#bbb" : "#333"; g.font = `${Math.round(w / 14)}px system-ui`; g.fillText(k, x + 4, y + h - 5) }
  })
  const r = await fetch("/api/dev/snapshot", { method: "POST", body: JSON.stringify({ name, png: out.toDataURL() }) })
  return r.status
}

window.edgeStats = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  const bg = dark ? [0x23,0x22,0x20] : [0xf4,0xf4,0xf2];
  const lum = (r,g,b)=>0.2126*r+0.7152*g+0.0722*b;
  const L0 = lum(...bg);
  const out = {};
  for (const [k, cv] of window.cells) {
    const g = cv.getContext('2d'); const w = cv.width, h = cv.height;
    const d = g.getImageData(0,0,w,h).data;
    const edge = (xs, ys) => { let m = 0; for (const x of xs) for (const y of ys) { const i=(y*w+x)*4; m = Math.max(m, Math.abs(lum(d[i],d[i+1],d[i+2]) - L0)); } return m };
    const xsAll = [...Array(w).keys()], ysAll = [...Array(h).keys()];
    out[k] = { b: Math.round(edge(xsAll,[h-1])), t: Math.round(edge(xsAll,[0])), l: Math.round(edge([0], ysAll)), r: Math.round(edge([w-1], ysAll)) };
  }
  return out;
};
// window.sheetOf(name, keys|null, cols, scale, label) -> [status, w, h]: a sheet of the chosen cells (cell canvases are used as drawn)
window.sheetOf = async (name, keys, cols, scale = 0.5, label = true) => {
  const cs = keys ? keys.map(k => window.cells.find(c => c[0] === k)).filter(Boolean) : window.cells;
  const dark = document.documentElement.dataset.theme === 'dark';
  const w = Math.round(cs[0][1].width * scale), h = Math.round(cs[0][1].height * scale), pad = 4;
  const out = document.createElement('canvas');
  out.width = cols * (w + pad) + pad; out.height = Math.ceil(cs.length / cols) * (h + pad) + pad;
  const g = out.getContext('2d');
  g.fillStyle = dark ? '#24221f' : '#ffffff'; g.fillRect(0, 0, out.width, out.height);
  g.imageSmoothingQuality = 'high';
  cs.forEach(([k, cv], i) => {
    const x = pad + (i % cols) * (w + pad), y = pad + Math.floor(i / cols) * (h + pad);
    g.fillStyle = dark ? '#232220' : '#f4f4f2'; g.fillRect(x, y, w, h);
    g.drawImage(cv, x, y, w, h);
    if (label) { g.fillStyle = dark ? '#bbb' : '#333'; g.font = '11px system-ui'; g.fillText(k, x + 4, y + h - 5); }
  });
  const r = await fetch('/api/dev/snapshot', { method: 'POST', body: JSON.stringify({ name, png: out.toDataURL() }) });
  return [r.status, out.width, out.height];
};
window.checksums = () => Object.fromEntries(cells.map(([k, cv]) => { const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data; let a = 0, b = 0; for (let i = 0; i < d.length; i += 4) { a = (a * 31 + d[i] + 7 * d[i+1] + 13 * d[i+2]) >>> 0; b += d[i] + d[i+1] + d[i+2] } return [k, a + ':' + b] }))
window.probe = (key, fx, fy) => { const [, cv] = cells.find(c => c[0] === key); const x = Math.round(cv.width * fx), y = Math.round(cv.height * fy); return Array.from(cv.getContext('2d').getImageData(x, y, 1, 1).data.slice(0, 3)) }
window.bbox = () => Object.fromEntries(cells.map(([k, cv]) => { const w = cv.width, h = cv.height, d = cv.getContext('2d').getImageData(0, 0, w, h).data; const bg = theme === 'dark' ? [35, 34, 32] : [244, 244, 242]; let x0 = w, x1 = 0, y0 = h, y1 = 0; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; if (Math.abs(d[i] - bg[0]) + Math.abs(d[i+1] - bg[1]) + Math.abs(d[i+2] - bg[2]) > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y } } return [k, [x1 - x0, y1 - y0]] }))
window.ready = true
</script></body></html>
